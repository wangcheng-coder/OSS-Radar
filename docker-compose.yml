services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ossradar
      POSTGRES_USER: ossradar
      POSTGRES_PASSWORD: ossradar
    ports:
      - "5433:5432"
    volumes:
      - or_pg:/var/lib/postgresql/data
  api:
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/ossradar
      SPRING_DATASOURCE_USERNAME: ossradar
      SPRING_DATASOURCE_PASSWORD: ossradar
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    ports:
      - "8081:8081"
    depends_on:
      - db
volumes:
  or_pg:
